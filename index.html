<!DOCTYPE html>
<html>
<head>
  <title>Asim Fashion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f3f3f3;
    }

    header {
      background: black;
      color: gold;
      text-align: center;
      padding: 15px;
      font-size: 22px;
    }

    /* Search Bar */
    #searchInput {
      width: 90%;
      padding: 10px;
      margin: 10px;
      border-radius: 8px;
      border: 2px solid black;
    }

    /* Categories */
    .categories {
      display: flex;
      overflow-x: auto;
      padding: 10px;
      background: white;
    }

    .cat {
      margin: 5px;
      padding: 10px;
      background: black;
      color: white;
      border-radius: 8px;
      white-space: nowrap;
    }

    /* Products */
    .product {
      background: white;
      margin: 10px;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
    }

    .product img {
      width: 100%;
      max-width: 200px;
      border-radius: 10px;
    }

    .btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 15px;
      background: green;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    /* WhatsApp floating button */
    .whatsapp {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: #25D366;
      color: white;
      padding: 12px;
      border-radius: 50%;
      font-size: 20px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>Asim Fashion</header>

<!-- Search Bar -->
<input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchProduct()">

<!-- Categories -->
<div class="categories">
  <div class="cat">Kurta</div>
  <div class="cat">Shirt</div>
  <div class="cat">Lower</div>
  <div class="cat">Shoes</div>
  <div class="cat">Casual Wear</div>
</div>

<!-- Products -->
<div class="product">
  <img src="https://via.placeholder.com/200">
  <h3>Kurta</h3>
  <a class="btn" href="https://wa.me/918700007955?text=Order Kurta">Order</a>
</div>

<div class="product">
  <img src="https://via.placeholder.com/200">
  <h3>Shirt</h3>
  <a class="btn" href="https://wa.me/918700007955?text=Order Shirt">Order</a>
</div>

<div class="product">
  <img src="https://via.placeholder.com/200">
  <h3>Lower</h3>
  <a class="btn" href="https://wa.me/918700007955?text=Order Lower">Order</a>
</div>

<div class="product">
  <img src="https://via.placeholder.com/200">
  <h3>Shoes</h3>
  <a class="btn" href="https://wa.me/918700007955?text=Order Shoes">Order</a>
</div>

<!-- Floating WhatsApp -->
<a class="whatsapp" href="https://wa.me/918700007955">💬</a>

<!-- Search Script -->
<script>
function searchProduct() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let products = document.getElementsByClassName("product");

  for (let i = 0; i < products.length; i++) {
    let text = products[i].innerText.toLowerCase();

    if (text.includes(input)) {
      products[i].style.display = "";
    } else {
      products[i].style.display = "none";
    }
  }
}
</script>

</body>
</html
