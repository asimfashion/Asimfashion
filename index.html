<!DOCTYPE html>
<html>
<head>
  <title>Asim Fashion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f3f3f3;
    }

    header {
      background: linear-gradient(45deg, black, #222);
      color: gold;
      text-align: center;
      padding: 25px;
    }

    header h1 {
      margin: 0;
      letter-spacing: 3px;
    }

    header p {
      margin-top: 5px;
      color: #ccc;
    }

    /* CATEGORY */
    .categories {
      display: flex;
      overflow-x: auto;
      padding: 10px;
    }

    .cat {
      min-width: 120px;
      margin: 10px;
      text-align: center;
    }

    .cat img {
      width: 100%;
      height: 120px;
      border-radius: 10px;
      object-fit: cover;
    }

    .cat p {
      margin-top: 5px;
      font-weight: bold;
    }

    h2 {
      text-align: center;
      margin-top: 20px;
      color: #333;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .product {
      background: white;
      margin: 10px;
      padding: 10px;
      border-radius: 12px;
      width: 160px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .product img {
      width: 100%;
      border-radius: 10px;
    }

    .btn {
      display: inline-block;
      background: green;
      color: white;
      padding: 8px;
      text-decoration: none;
      margin-top: 8px;
      border-radius: 5px;
      font-size: 14px;
    }

    /* BOTTOM WHATSAPP BUTTON */
    .bottom-whatsapp {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: green;
      color: white;
      text-align: center;
      padding: 12px;
      font-size: 18px;
      text-decoration: none;
    }

    footer {
      background: black;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 50px;
    }
  </style>
</head>

<body>

<header>
  <h1>ASIM FASHION</h1>
  <p>Premium Casual & Linen Wear</p>
</header>

<!-- CATEGORY -->
<div class="categories">

  <div class="cat">
    <img src="https://images.unsplash.com/photo-1520975922284-9e0f5c3c7b5b?auto=format&fit=crop&w=400&q=80">
    <p>Men</p>
  </div>

  <div class="cat">
    <img src="https://images.unsplash.com/photo-1593032465175-481ac7f401a0?auto=format&fit=crop&w=400&q=80">
    <p>Women</p>
  </div>

  <div class="cat">
    <img src="https://images.unsplash.com/photo-1516826957135-700dedea698c?auto=format&fit=crop&w=400&q=80">
    <p>Lowers</p>
  </div>

  <div class="cat">
    <img src="https://images.unsplash.com/photo-1528701800489-20be3c1a02c1?auto=format&fit=crop&w=400&q=80">
    <p>Shoes</p>
  </div>

</div>

<!-- PRODUCTS -->
<h2>Trending Products 🔥</h2>
<div class="container">

  <div class="product">
    <img src="https://images.unsplash.com/photo-1603252109303-2751441dd157?auto=format&fit=crop&w=400&q=80">
    <h3>Linen Shirt</h3>
    <a class="btn" href="https://wa.me/918700007955?text=Order%20Linen%20Shirt">Order</a>
  </div>

  <div class="product">
    <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?auto=format&fit=crop&w=400&q=80">
    <h3>Stylish Kurta</h3>
    <a class="btn" href="https://wa.me/918700007955?text=Order%20Kurta">Order</a>
  </div>

</div>

<!-- BOTTOM WHATSAPP -->
<a class="bottom-whatsapp" href="https://wa.me/918700007955">
  💬 Chat on WhatsApp
</a>

<footer>
  <p>Contact: 8700007955</p>
  <p>© 2026 ASIM FASHION</p>
</footer>

</body>
</html>
