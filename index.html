<!DOCTYPE html>
<html>
<head>
  <title>Asim Fashion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
    }

    header {
      background: linear-gradient(45deg, black, #222);
      color: gold;
      text-align: center;
      padding: 18px;
      font-size: 24px;
      font-weight: bold;
    }

    .search-box {
      padding: 10px;
      background: white;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    #searchInput {
      width: 95%;
      padding: 12px;
      border-radius: 25px;
      border: none;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
      outline: none;
    }

    .categories {
      display: flex;
      overflow-x: auto;
      background: white;
      padding: 10px;
    }

    .cat {
      padding: 8px 15px;
      margin: 5px;
      border-radius: 20px;
      background: #eee;
      cursor: pointer;
    }

    .cat.active {
      background: black;
      color: white;
    }

    .container {
      padding: 10px;
    }

    .product {
      background: white;
      margin-bottom: 15px;
      border-radius: 15px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .product img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }

    .btn {
      display: inline-block;
      padding: 10px 15px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 20px;
      margin-top: 8px;
    }

    .whatsapp {
      position: fixed;
      bottom: 15px;
      right: 15px;
      background: #25D366;
      color: white;
      font-size: 22px;
      padding: 14px;
      border-radius: 50%;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>Asim Fashion</header>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search products..." onkeyup="filterAll()">
</div>

<div class="categories">
  <div class="cat active" onclick="setCategory(event,'all')">All</div>
  <div class="cat" onclick="setCategory(event,'kurta')">Kurta</div>
  <div class="cat" onclick="setCategory(event,'shirt')">Shirt</div>
  <div class="cat" onclick="setCategory(event,'lower')">Lower</div>
  <div class="cat" onclick="setCategory(event,'shoes')">Shoes</div>
</div>

<div class="container">

  <div class="product" data-category="kurta">
    <img src="https://via.placeholder.com/300">
    <h3>Kurta</h3>
    <a class="btn" href="https://wa.me/918700007955?text=I want to order Kurta">Order Now</a>
  </div>

  <div class="product" data-category="shirt">
    <img src="https://via.placeholder.com/300">
    <h3>Shirt</h3>
    <a class="btn" href="https://wa.me/918700007955?text=I want to order Shirt">Order Now</a>
  </div>

  <div class="product" data-category="lower">
    <img src="https://via.placeholder.com/300">
    <h3>Lower</h3>
    <a class="btn" href="https://wa.me/918700007955?text=I want to order Lower">Order Now</a>
  </div>

  <div class="product" data-category="shoes">
    <img src="https://via.placeholder.com/300">
    <h3>Shoes</h3>
    <a class="btn" href="https://wa.me/918700007955?text=I want to order Shoes">Order Now</a>
  </div>

</div>

<a class="whatsapp" href="https://wa.me/918700007955">💬</a>

<script>
let currentCategory = "all";

function setCategory(e, category) {
  currentCategory = category;

  let cats = document.querySelectorAll(".cat");
  cats.forEach(c => c.classList.remove("active"));
  e.target.classList.add("active");

  filterAll();
}

function filterAll() {
  let input = document.getElementById("searchInput").value.toLowerCase();
  let products = document.querySelectorAll(".product");

  products.forEach(p => {
    let text = p.innerText.toLowerCase();
    let category = p.getAttribute("data-category");

    if (
      (currentCategory === "all" || category === currentCategory) &&
      text.includes(input)
    ) {
      p.style.display = "block";
    } else {
      p.style.display = "none";
    }
  });
}
</script>

</body>
</html>

  <div class="product" data-category="kurta">

  </div>

  <div class="product" data-category="lower">
    <img src="IMG_20260328_004022.jpg">
    <h3>Casual Wear</h3>
    <a class="btn" href="https://wa.me/918700007955?text=I want to order Casual Wear">Order Now</a>
  </div>

  <div class="product" data-category="shoes">
    <img src="IMG_20260328_003900.jpg">
    <h3>Shoes</h3>
    <a class="btn" href="https://wa.me/918700007955?text=I want to order Shoes">Order Now</a>
  </div>

</div>
