<!DOCTYPE html>
<html>
<head>
  <title>Asim Fashion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f3f3f3;
    }

    header {
      background: black;
      color: gold;
      text-align: center;
      padding: 20px;
      font-size: 24px;
      letter-spacing: 2px;
    }

    .categories {
      display: flex;
      overflow-x: auto;
      padding: 10px;
      background: white;
    }

    .cat {
      min-width: 100px;
      margin: 10px;
      text-align: center;
      font-weight: bold;
    }

    .container {
      padding: 10px;
    }

    .product {
      background: white;
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .product img {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      object-fit: cover;
    }

    .details {
      margin-left: 15px;
    }

    .btn {
      display: inline-block;
      background: green;
      color: white;
      padding: 6px 10px;
      text-decoration: none;
      margin-top: 5px;
      border-radius: 5px;
      font-size: 14px;
    }

    .whatsapp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25D366;
      border-radius: 50%;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .whatsapp img {
      width: 30px;
      height: 30px;
    }
  </style>
</head>

<body>

<header>ASIM FASHION</header>

<div class="categories">
  <div class="cat">Kurta</div>
  <div class="cat">Shirt</div>
  <div class="cat">Lower</div>
  <div class="cat">Shoes</div>
  <div class="cat">Casual Wear</div>
</div>

<div class="container">

  <!-- KURTA -->
  <div class="product">
    <img src="IMG_20260328_003921.jpg">
    <div class="details">
      <h3>Stylish Linen Kurta</h3>
      <a class="btn" href="https://wa.me/918700007955?text=Order Stylish Linen Kurta">Order</a>
    </div>
  </div>

  <!-- SHIRT PANT -->
  <div class="product">
    <img src="81TQE12DujL._AC_UL1500_.jpg">
    <div class="details">
      <h3>Shirt Pant</h3>
      <a class="btn" href="https://wa.me/918700007955?text=Order Shirt Pant">Order</a>
    </div>
  </div>

  <!-- CASUAL WEAR -->
  <div class="product">
    <img src="IMG_20260328_004022.jpg">
    <div class="details">
      <h3>Casual Wear</h3>
      <a class="btn" href="https://wa.me/918700007955?text=Order Casual Wear">Order</a>
    </div>
  </div>

  <!-- SHOES -->
  <div class="product">
    <img src="IMG_20260328_003900.jpg">
    <div class="details">
      <h3>Shoes</h3>
      <a class="btn" href="https://wa.me/918700007955?text=Order Shoes">Order</a>
    </div>
  </div>

</div>

<a class="whatsapp" href="https://wa.me/918700007955">
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
</a>

</body>
</html>
