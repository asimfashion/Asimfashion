<!DOCTYPE html>
<html>
<head>
  <title>Asim Fashion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f3f3f3;
    }

    header {
      background: black;
      color: gold;
      text-align: center;
      padding: 20px;
      font-size: 24px;
      letter-spacing: 2px;
    }

    /* SEARCH BAR */
    .search-box {
      text-align: center;
      padding: 10px;
      background: white;
    }

    .search-box input {
      width: 80%;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid #ccc;
      outline: none;
    }

    /* CATEGORY */
    .categories {
      display: flex;
      overflow-x: auto;
      padding: 10px;
      background: white;
    }

    .cat {
      min-width: 100px;
      margin: 10px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
      padding: 5px;
      border-radius: 10px;
      background: #eee;
    }

    /* PRODUCTS */
    .container {
      padding: 10px;
    }

    .product {
      background: white;
      margin: 10px 0;
      padding: 10px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .product img {
      width: 100px;
      height: 100px;
      border-radius: 10px;
      object-fit: cover;
    }

    .details {
      margin-left: 15px;
    }

    .btn {
      display: inline-block;
      background: green;
      color: white;
      padding: 6px 10px;
      text-decoration: none;
      margin-top: 5px;
      border-radius: 5px;
      font-size: 14px;
    }

    /* WHATSAPP */
    .whatsapp {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #25D366;
      border-radius: 50%;
      padding: 15px;
    }

    .whatsapp img {
      width: 30px;
    }
  </style>
</head>

<body>

<header>ASIM FASHION</header>

<!-- SEARCH -->
<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search products..." onkeyup="searchProducts()">
</div>

<!-- CATEGORY -->
<div class="categories">
  <div class="cat" onclick="filterProducts('all')">All</div>
  <div class="cat" onclick="filterProducts('kurta')">Kurta</div>
  <div class="cat" onclick="filterProducts('shirt')">Shirt</div>
  <div class="cat" onclick="filterProducts('lower')">Lower</div>
  <div class="cat" onclick="filterProducts('shoes')">Shoes</div>
</div>

<!-- PRODUCTS -->
<div class="container">

  <div class="product shirt">
    <img src="https://images.unsplash.com/photo-1603252109303-2751441dd157">
    <div class="details">
      <h3>Linen Shirt</h3>
      <a class="btn" href="https://wa.me/918700007955?text=Order%20Linen%20Shirt">Order</a>
    </div>
  </div>

  <div class="product kurta">
    <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c">
    <div class="details">
      <h3>Stylish Kurta</h3>
      <a class="btn" href="https://wa.me/918700007955?text=Order%20Kurta">Order</a>
    </div>
  </div>

  <div class="product lower">
    <img src="https://images.unsplash.com/photo-1516826957135-700dedea698c">
    <div class="details">
      <h3>Lower</h3>
      <a class="btn" href="https://wa.me/918700007955?text=Order%20Lower">Order</a>
    </div>
  </div>

</div>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/918700007955">
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
</a>

<script>
function filterProducts(category) {
  let products = document.getElementsByClassName('product');

  for (let i = 0; i < products.length; i++) {
    if (category === "all") {
      products[i].style.display = "flex";
    } else {
      if (products[i].classList.contains(category)) {
        products[i].style.display = "flex";
      } else {
        products[i].style.display = "none";
      }
    }
  }
}

function searchProducts() {
  let input = document.getElementById('searchInput').value.toLowerCase();
  let products = document.getElementsByClassName('product');

  for (let i = 0; i < products.length; i++) {
    let text = products[i].innerText.toLowerCase();
    if (text.includes(input)) {
      products[i].style.display = "flex";
    } else {
      products[i].style.display = "none";
    }
  }
}
</script>

</body>
</html>
