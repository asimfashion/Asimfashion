<!DOCTYPE html>
<html>
<head>
  <title>Asim Fashion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }
    header {
      background: black;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 24px;
    }
    .hero {
      background: url('https://images.unsplash.com/photo-1521334884684-d80222895322') no-repeat center;
      background-size: cover;
      height: 300px;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      font-weight: bold;
    }
    .section {
      padding: 20px;
      text-align: center;
    }
    .products {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .card {
      border: 1px solid #ddd;
      padding: 10px;
      width: 200px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ddd;
    }
    .card img {
      width: 100%;
      border-radius: 10px;
    }
    .btn {
      background: black;
      color: white;
      padding: 10px;
      border: none;
      margin-top: 10px;
      cursor: pointer;
      border-radius: 5px;
    }
    footer {
      background: black;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  Asim Fashion 👕
</header>

<div class="hero">
  Style That Defines You
</div>

<div class="section">
  <h2>Our Products</h2>

  <div class="products">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf">
      <h3>Shirts</h3>
      <p>Trendy & Comfortable</p>
      <button class="btn">Buy Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1593032465175-481ac7f401a0">
      <h3>Kurtas</h3>
      <p>Ethnic & Stylish</p>
      <button class="btn">Buy Now</button>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1583001809873-a128495da465">
      <h3>Shoes</h3>
      <p>Comfort & Style</p>
      <button class="btn">Buy Now</button>
    </div>

  </div>
</div>

<footer>
  © 2026 Asim Fashion | All Rights Reserved
</footer>

</body>
</html>
